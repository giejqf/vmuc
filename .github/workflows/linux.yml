name: linux

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, darwin cross-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup target add aarch64-apple-darwin aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --all-targets --target aarch64-apple-darwin
      - run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings
      - name: Guest agent (static musl)
        run: cargo build -p vmuc-agent --release --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: vmuc-agent-aarch64
          path: target/aarch64-unknown-linux-musl/release/vmuc-agent

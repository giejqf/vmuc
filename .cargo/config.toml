# The guest agent is a static musl binary. Rust's musl target is
# self-contained (crt objects and libc.a ship with it) and rust-lld ships
# with the toolchain, so the same link works on a Linux box and on a Mac
# with no cross toolchain or musl sysroot.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]

[alias]
check-darwin = "check --workspace --all-targets --target aarch64-apple-darwin"
clippy-darwin = "clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings"

# Test and run binaries need com.apple.security.hypervisor to call hv_*.
[target.aarch64-apple-darwin]
runner = "scripts/sign-run.sh"

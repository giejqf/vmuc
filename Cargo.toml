[workspace]
resolver = "3"
members = [
    "crates/vmuc-hv",
    "crates/vmuc-vmm",
    "crates/vmuc-virtio",
    "crates/vmuc-fs",
    "crates/vmuc-net",
    "crates/vmuc-image",
    "crates/vmuc-config",
    "crates/vmuc-proto",
    "crates/vmuc-agent",
    "crates/vmuc-tui",
    "crates/vmuc-cli",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/giejqf/vmuc"
rust-version = "1.97"

[workspace.dependencies]
# Non-VM concerns only. The allowed list lives in docs/plan.md.
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# vmuc-config
dirs = "6"
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
# vmuc-image
crc32fast = "1.5"
flate2 = "1.1"
hex = "0.4"
lzma-rs = "0.3"
sha2 = "0.11"
ureq = { version = "3.4", default-features = false }
# dev
tempfile = "3.27"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

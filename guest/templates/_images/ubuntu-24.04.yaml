# Ubuntu 24.04 LTS (Noble) arm64 cloud image.
#
# The dated snapshot is pinned with the sha256 from
# https://cloud-images.ubuntu.com/releases/24.04/release-20260926/SHA256SUMS
# (Ubuntu removes dated directories after a few months; the undated
# "release" entry below is the unpinned fallback, like Lima's templates).
images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"
# Fallback to the latest release image. Run `vmuc prune` to drop a stale cache entry.
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

# Daemons for modems, removable disks and SAN paths, which a VM has none
# of: about 25 MiB of host memory at idle
# (docs/experiments/2026-10-12-idle-footprint.md). Disabled on the first
# boot; later boots only check.
provision:
- mode: boot
  script: |
    if systemctl -q is-enabled ModemManager.service 2>/dev/null; then
      systemctl disable --now ModemManager.service udisks2.service \
        multipathd.socket multipathd.service
    fi

# Alpine Linux 3.23 arm64 "generic" cloud image (cloud-init, all datasources).
#
# Pinned with the sha512 published next to the image:
# https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/generic_alpine-3.23.5-aarch64-uefi-cloudinit-r0.qcow2.sha512
# The image is qcow2; vmuc converts it to a raw sparse disk at create time.
# Alpine uses OpenRC, not systemd: boot.sh installs an OpenRC service for
# the agent when systemctl is absent.

# vmuc instance configuration reference (generated from the schema by
# crates/vmuc-config/src/reference.rs; edit that, not this file).
#
# Every key is listed with its built-in default. `null` (or an omitted
# key) means "unset", which lets the layering fill it in:
#
#   built-in default  <  ~/.vmuc/_config/default.yaml  <  the instance's
#   vmuc.yaml  <  ~/.vmuc/_config/override.yaml
#
# Scalars take the highest-priority set value. `env` and `param` are
# merged (override wins per key). `provision`, `probes` and
# `portForwards` are concatenated override + instance + default, so
# first-match rules respect priority. `mounts` are merged by location
# with the highest-priority `writable`/`mountPoint` winning. `dns` and
# `images` take the highest-priority non-empty list whole.
#
# `vmuc create template:reference` creates an instance with every
# built-in default (and no image, so it cannot start). Copy the keys
# you want into your own template instead.
#
# Keys are camelCase; unknown keys are an error.

# ----------------------------------------------------------------------
# BASIC CONFIGURATION
# ----------------------------------------------------------------------

# Templates to flatten into this one at `vmuc create` time. Each entry
# is `template:NAME` (searched in $VMUC_TEMPLATES_PATH,
# ~/.vmuc/_templates, the installed templates, then the built-in ones)
# or a file path relative to this file. The child wins for scalars and
# maps; `provision` and `probes` run base-first; other lists are
# child-first; mounts merge by location; a non-empty child `images`
# replaces the base's. Earlier entries win over later ones. Nesting is
# limited to 8 levels.
# Built-in default: [] (and `default.yaml` uses the Ubuntu image and the
# ~ mount)
base: null

# Root filesystem candidates, tried in order: the first one that
# downloads and verifies is used.
# Built-in default: [] (an instance cannot start without an image)
images: null
# - location: "https://cloud-images.ubuntu.com/.../ubuntu-24.04-server-cloudimg-arm64.img"
#   arch: "aarch64"
#   digest: "sha256:..."
#   kernel:
#     location: "https://example.com/Image"
#     digest: "sha256:..."
#     cmdline: "console=hvc0 root=/dev/vda1 rw"

# Number of vCPUs.
# Built-in default: 4
cpus: null

# Guest RAM ceiling. The host pays only for pages the guest touches and
# gets back what the guest frees (free page reporting is always on).
# Binary units: "8GiB", "8G", "8192MiB", "8192M". Minimum 64MiB.
# Built-in default: min("8GiB", half of the host's RAM)
memory: null

# Virtual disk size: a sparse raw file that grows on demand. Minimum
# 1GiB.
# Built-in default: "100GiB"
disk: null

# Host directories shared into the guest over virtiofs. macOS asks once
# before the guest may read Desktop, Documents or Downloads.
# Built-in default: the host home ("~") read-only at the same path
mounts: null
# - location: "~/src"
#   mountPoint: "/src"
#   writable: true

# ----------------------------------------------------------------------
# ADVANCED CONFIGURATION
# ----------------------------------------------------------------------

# How `vmuc shell` and plain ssh reach the guest (always through vsock).
ssh:
  # Also authorize ~/.ssh/*.pub besides ~/.vmuc/_config/user.pub.
  # Built-in default: false
  loadDotSSHPubKeys: null
  # Forward the host ssh agent into `vmuc shell`.
  # Built-in default: false
  forwardAgent: null

# Guest networking through macOS vmnet, via the root helper `vmuc
# sudoers` installs; without it the instance boots without a NIC (ssh,
# shares and port forwards still work over vsock).
network:
  # "shared": NAT behind the host, the guest gets a 192.168.x address
  # the host can reach. "bridged": the guest joins the network of
  # `interface`.
  # Built-in default: "shared"
  mode: null
  # Host interface for bridged mode (e.g. "en0"); required there.
  # Built-in default: none
  interface: null
  # The NIC's MAC address.
  # Built-in default: a stable address derived from the instance name
  macAddress: null

# Guest TCP listeners appear on the host, matched against these rules
# first to last; the override, instance and default lists are
# concatenated in that order and a catch-all rule (every guest listener
# on 0.0.0.0 or 127.0.0.1, ports 1024 and up except 22, to the same port
# on 127.0.0.1) ends the list. Forwarding rides vsock and needs no NIC.
# Built-in default: [] (plus the catch-all rule)
portForwards: null
# - guestPort: 8080
#   hostPort: 18080

# Scripts run on every boot from the seed after the agent is up, in list
# order: `boot` first (cloud-init bootcmd, early), then `data` files are
# written, then the network is waited for (when there is a NIC), then
# `system` scripts run as root and `user` scripts as the instance user.
# Scripts see VMUC_* variables (VMUC_USER, VMUC_UID, VMUC_HOME,
# VMUC_BOOT_ID, VMUC_PARAM_<KEY>, ...). Make them idempotent.
# Built-in default: []
provision: null
# - mode: system
#   script: |
#     #!/bin/sh
#     set -eu
#     apt-get install -y htop
# - mode: data
#   path: /etc/motd
#   content: "hello"

# Readiness probes the host runs through the agent until they succeed
# (timeout: `vmuc start --timeout`).
# Built-in default: []
probes: null
# - description: "docker is running"
#   script: |
#     #!/bin/sh
#     docker info >/dev/null
#   hint: "See /var/log/cloud-init-output.log in the guest."

# Environment variables for provisioning scripts and the login shell.
# Built-in default: {}
env: null
# HTTP_PROXY: http://proxy.example.com:3128

# Template parameters, exported to scripts as VMUC_PARAM_<KEY>. Keys
# match [A-Za-z_][A-Za-z0-9_]*.
# Built-in default: {}
param: null

# The guest account `vmuc shell` logs in as.
user:
  # Login name.
  # Built-in default: the host user name when it is a valid POSIX name
  # that is not a system account, else "vmuc"
  name: null
  # Numeric user ID (matching the host's keeps shared files' owners
  # right).
  # Built-in default: the host uid when 500 <= uid < 60000, else 1000
  uid: null
  # Home directory.
  # Built-in default: /home/<name>.linux (clear of the mirrored host
  # home)
  home: null
  # Login shell.
  # Built-in default: /bin/bash
  shell: null
  # GECOS field.
  # Built-in default: ""
  comment: null
  # Whether sudo asks for a password.
  # Built-in default: true
  passwordlessSudo: null

# IANA zone name applied inside the guest.
# Built-in default: the host's zone, else "UTC"
timezone: null

# Printed after `vmuc start`.
# Built-in default: ""
message: null

# Nameservers written to the guest's resolv.conf instead.
# Built-in default: [] (the DNS server vmnet's DHCP hands out: the
# host's resolver)
dns: null

# Reserved for vmuc's own user-space network (v0.2); ignored with vmnet,
# whose DHCP already points the guest at the host's resolver.
# Built-in default: true
hostResolver: null

# vmuc instance configuration reference.
#
# Every field is listed with its built-in default. `null` (or an omitted
# key) means "unset", which lets the layering fill it in:
#
#   built-in default  <  ~/.vmuc/_config/default.yaml  <  the instance's
#   vmuc.yaml  <  ~/.vmuc/_config/override.yaml
#
# Scalars take the highest-priority set value. `env` and `param` are
# merged (override wins per key). `provision`, `probes` and
# `portForwards` are concatenated override + instance + default, so
# first-match rules respect priority. `mounts` are merged by location
# with the highest-priority `writable`/`mountPoint` winning. `dns` and
# `images` take the highest-priority non-empty list whole.
#
# `vmuc create template:reference` creates an instance with every
# built-in default (and no image, so it cannot start). Copy the keys
# you want into your own template instead.
#
# Keys are camelCase; unknown keys are an error.

# ----------------------------------------------------------------------
# BASIC CONFIGURATION
# ----------------------------------------------------------------------

# Templates to flatten into this one at `vmuc create` time. Each entry is
# `template:NAME` (searched in $VMUC_TEMPLATES_PATH, ~/.vmuc/_templates,
# the installed templates, then the built-in ones) or a file path
# relative to this file. The child wins for scalars and maps; `provision`
# and `probes` run base-first; other lists are child-first; mounts merge
# by location; a non-empty child `images` replaces the base's. Earlier
# entries win over later ones. Nesting is limited to 8 levels.
# Built-in default: [] (and `default.yaml` uses the Ubuntu image + ~ mount)
base: null

# Rootfs candidates, tried in order: the first one that downloads and
# verifies is used. `location` is an https:// URL or a local path;
# `arch` is always "aarch64"; `digest` is "sha256:..." or "sha512:..."
# and is strongly recommended. `kernel` overrides the kernel vmuc ships.
# Built-in default: [] (an instance cannot start without an image)
images: null
# - location: "https://cloud-images.ubuntu.com/.../ubuntu-24.04-server-cloudimg-arm64.img"
#   arch: "aarch64"
#   digest: "sha256:..."
#   kernel:
#     location: "https://example.com/Image"
#     digest: "sha256:..."
#     cmdline: "console=hvc0 root=/dev/vda1 rw"

# Number of vCPUs.
# Built-in default: 4
cpus: null

# Guest RAM ceiling. The host pays only for pages the guest touches and
# gets back what the guest frees (free page reporting is always on).
# Binary units: "8GiB", "8G", "8192MiB", "8192M". Minimum 64MiB.
# Built-in default: min("8GiB", half of the host RAM)
memory: null

# Virtual disk size; a sparse raw file that grows on demand. Minimum 1GiB.
# Built-in default: "100GiB"
disk: null

# Host directories shared into the guest over virtiofs.
# Built-in default: the host home ("~") read-only at the same path.
mounts: null
# - location: "~"             # host path; "~" expands to the host home
#   # Guest path.
#   # Built-in default: the expanded host path (mirrored)
#   mountPoint: null
#   # Built-in default: false
#   writable: null

# ----------------------------------------------------------------------
# ADVANCED CONFIGURATION
# ----------------------------------------------------------------------

ssh:
  # Also authorize ~/.ssh/*.pub in addition to ~/.vmuc/_config/user.pub.
  # Built-in default: false
  loadDotSSHPubKeys: null
  # Forward the host ssh agent into `vmuc shell`.
  # Built-in default: false
  forwardAgent: null

network:
  # "shared" is vmuc's own user-space NAT. "bridged" is reserved and not
  # implemented in v0.1 (it would need `interface`).
  # Built-in default: "shared"
  mode: null
  # Host interface for bridged mode.
  # Built-in default: none
  interface: null
  # Built-in default: a stable address derived from the instance name
  macAddress: null

# Port forwarding rules, matched first to last; the override, instance
# and default lists are concatenated in that order and a catch-all rule
# (every guest listener on 0.0.0.0 -> same port on 127.0.0.1) ends the
# list. Guest listeners are discovered by the agent; `static: true`
# forwards even when nothing listens; `ignore: true` blocks a match.
# Built-in default: [] (plus the catch-all rule)
portForwards: null
# - guestIp: 127.0.0.1         # Built-in default: 127.0.0.1 (also matches 0.0.0.0)
#   guestPort: 8080            # exclusive with guestPortRange
#   guestPortRange: [1, 65535] # Built-in default: [1, 65535]
#   hostIp: 127.0.0.1          # Built-in default: 127.0.0.1
#   hostPort: 8080             # exclusive with hostPortRange
#   hostPortRange: [1, 65535]  # Built-in default: same as the guest range
#   proto: tcp                 # tcp | udp | any. Built-in default: any
#   ignore: false
#   static: false

# Provisioning. Scripts run on every boot from the cidata ISO after the
# agent is up, in list order: `mode: boot` first (cloud-init bootcmd,
# before networking), then `data` files are written, then `system`
# scripts as root, then `user` scripts as the instance user. Scripts see
# VMUC_* variables (VMUC_USER, VMUC_UID, VMUC_HOME, VMUC_BOOT_ID,
# VMUC_PARAM_<KEY>, ...). Make scripts idempotent.
# Built-in default: []
provision: null
# - mode: system               # system | user | boot | data. Built-in default: system
#   script: |
#     #!/bin/sh
#     set -eu
#     apt-get install -y htop
# - mode: data                 # writes `content` to `path` instead of running a script
#   path: /etc/motd
#   content: "hello"
#   owner: "root:root"         # Built-in default: root:root
#   permissions: "0644"        # Built-in default: 0644
#   overwrite: true            # Built-in default: true

# Readiness probes run by the host through the agent until they succeed
# (timeout: `vmuc start --timeout`). `hint` is printed on failure.
# Built-in default: []
probes: null
# - mode: readiness            # the only mode. Built-in default: readiness
#   description: "docker is running"
#   script: |
#     #!/bin/sh
#     docker info >/dev/null
#   hint: "See /var/log/cloud-init-output.log in the guest."

# Environment variables for provisioning scripts and the login shell.
# Built-in default: {}
env: null
# env:
#   HTTP_PROXY: http://proxy.example.com:3128

# Template parameters, exported to scripts as VMUC_PARAM_<KEY>. Keys
# must match [A-Za-z_][A-Za-z0-9_]*.
# Built-in default: {}
param: null

user:
  # The guest login user.
  # Built-in default: the host user name when it is a valid POSIX name
  # that is not a system account, else "vmuc"
  name: null
  # Built-in default: the host uid when 500 <= uid < 60000, else 1000
  uid: null
  # Built-in default: /home/<name>.linux (keeps clear of the mirrored host home)
  home: null
  # Built-in default: /bin/bash
  shell: null
  # GECOS field.
  # Built-in default: ""
  comment: null
  # Built-in default: true
  passwordlessSudo: null

# IANA zone name applied inside the guest.
# Built-in default: the host's zone, else "UTC"
timezone: null

memoryPolicy:
  # Inflate the balloon when macOS reports memory pressure (hysteresis
  # rules in docs/plan.md). Free page reporting is always on regardless.
  # Built-in default: false
  pressureBalloon: null
  # The balloon never pushes guest "available" memory below this.
  # Built-in default: "256MiB"
  minAvailable: null

# Printed after `vmuc start`.
# Built-in default: ""
message: null

# Nameservers for the guest. When set, the guest uses them directly
# instead of the host resolver.
# Built-in default: [] (the NAT's DNS forwarder, see hostResolver)
dns: null

# Resolve guest DNS queries through the host's resolver via the NAT.
# Built-in default: true
hostResolver: null

[package]
name = "vmuc-image"
description = "Image downloads and cache, qcow2 to raw, GPT, ISO9660 seed writer, sparse files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
crc32fast = { workspace = true }
lzma-rs = { workspace = true }

# TLS backend: the Linux dev box and CI cannot compile C for
# aarch64-apple-darwin (no SDK), so rustls' ring/aws-lc backends only build
# natively. On macOS the system Security.framework is used through
# native-tls (pure Rust FFI, like vmuc-hv); elsewhere rustls.
[target.'cfg(target_os = "macos")'.dependencies]
ureq = { workspace = true, features = ["native-tls"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { workspace = true, features = ["rustls"], optional = true }

# HTTP downloads. Off for crates that only need the sparse-file, GPT or
# qcow2 pieces (the block device), so the VMM's device models do not
# depend on a TLS stack.
[features]
default = ["fetch"]
fetch = ["dep:ureq"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
